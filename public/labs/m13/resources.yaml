apiVersion: apps/v1
kind: Deployment
metadata:
  name: m13
  namespace: kv-lab
  labels:
    lab: m13
spec:
  replicas: 2
  selector:
    matchLabels:
      app: m13
  template:
    metadata:
      labels:
        app: m13
        lab: m13
    spec:
      containers:
        - name: web
          image: nginx:1.28.0-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: m13
  namespace: kv-lab
  labels:
    lab: m13
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: m13
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
