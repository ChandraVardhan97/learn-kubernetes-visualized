apiVersion: v1
kind: Pod
metadata:
  name: m07-allowed
  namespace: kv-lab
  labels:
    lab: m07
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: app
      image: busybox:1.37.0
      command:
        - sleep
        - "3600"
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          cpu: 50m
          memory: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: m07-pending
  namespace: kv-lab
  labels:
    lab: m07
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: app
      image: busybox:1.37.0
      command:
        - sh
        - -c
        - sleep 3600
  nodeSelector:
    kv.example/absent: "true"
