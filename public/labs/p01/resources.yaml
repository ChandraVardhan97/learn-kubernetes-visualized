apiVersion: apps/v1
kind: Deployment
metadata:
  name: p01
  namespace: kv-lab
  labels:
    lab: p01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: p01
  template:
    metadata:
      labels:
        app: p01
        lab: p01
    spec:
      containers:
        - name: web
          image: nginx:1.28.0-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: p01
  namespace: kv-lab
  labels:
    lab: p01
spec:
  selector:
    app: p01
  ports:
    - port: 80
      targetPort: 81
---
apiVersion: v1
kind: Pod
metadata:
  name: p01-client
  namespace: kv-lab
  labels:
    lab: p01
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: app
      image: busybox:1.37.0
      command:
        - sh
        - -c
        - sleep 3600
