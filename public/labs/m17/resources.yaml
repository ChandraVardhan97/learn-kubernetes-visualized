apiVersion: v1
kind: Pod
metadata:
  name: m17-oom
  namespace: kv-lab
  labels:
    lab: m17
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: app
      image: busybox:1.37.0
      command:
        - dd
        - if=/dev/zero
        - of=/memory/fill
        - bs=1M
        - count=128
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          cpu: 100m
          memory: 16Mi
      volumeMounts:
        - name: memory
          mountPath: /memory
  restartPolicy: Never
  volumes:
    - name: memory
      emptyDir:
        medium: Memory
        sizeLimit: 128Mi
