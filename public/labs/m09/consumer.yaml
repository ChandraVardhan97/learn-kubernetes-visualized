apiVersion: v1
kind: Pod
metadata:
  name: m09
  namespace: kv-lab
  labels:
    lab: m09
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: app
      image: busybox:1.37.0
      command:
        - sleep
        - "3600"
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: m09
